# Build tự động image TEST cho Telegram gateway.
# Đặt file này tại .github/workflows/ của repo chứa code gateway.
# Image build xong tự đẩy lên GHCR, không cần build tay.
name: Build telegram-gateway test image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # Nếu code gateway nằm trong thư mục con của repo,
          # sửa context và file trỏ tới thư mục đó.
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tritue2011/telegram-gateway:test
            ghcr.io/tritue2011/telegram-gateway:test-${{ github.sha }}
