[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-call-client"
version = "0.1.0"
description = "Zalo voice-call signaling client (disassembly-based, offline-tested)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
