<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Studio điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
textarea{font:inherit}
textarea:focus{outline:none}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #0F766E;outline-offset:2px}
</style>
</helmet>
<div style="--ink:#181816;--mute:#66645F;--line:#E4E2DC;--bg:#F6F5F2;--card:#FFFFFF;--acc:#0F766E;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:14px;line-height:1.5;overflow:hidden">

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px">
<div style="display:flex;align-items:center;gap:10px">
<div style="width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
</div>
<span style="font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:500">web2api</span>
</div>
<div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:13px;color:var(--mute)">
<span style="width:8px;height:8px;border-radius:50%;background:#16A34A"></span>Ổn
</div>
</header>

<main style="flex:1;min-height:0;overflow:auto;padding:20px 16px 16px;display:flex;flex-direction:column;gap:18px">
<h1 style="margin:8px 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-0.02em;text-wrap:balance">Bạn muốn làm gì hôm nay?</h1>

<div style="background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(24,24,22,0.04),0 10px 28px rgba(24,24,22,0.06);display:flex;flex-direction:column;position:relative">
<label for="loi-nhan" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Lời nhắn</label>
<textarea id="loi-nhan" rows="3" placeholder="{{placeholder}}" style="border:0;resize:none;background:transparent;color:var(--ink);padding:16px 16px 4px;font-size:16px;line-height:1.5;border-radius:20px 20px 0 0"></textarea>
<sc-if value="{{nghe}}" hint-placeholder-val="{{false}}">
<div role="status" style="display:flex;align-items:center;gap:10px;margin:0 16px;padding:8px 12px;border-radius:12px;background:#FDECEA;color:#8A1C12;font-size:13px">
<span style="width:10px;height:10px;border-radius:50%;background:#B42318"></span>Đang nghe. Nói xong bấm nút micro để dừng, lời sẽ thành chữ trong ô nhập.
</div>
</sc-if>
<sc-if value="{{moM}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="Chọn model" style="position:absolute;left:8px;right:8px;bottom:72px;z-index:5;max-height:340px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(24,24,22,0.14);padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;flex-direction:column;line-height:1.3;flex:0 0 auto"><span style="font-weight:600">{{modelTitle}}</span><span style="font-size:12px;color:var(--mute)">{{modelSub}}</span></div>
<div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{models}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">
<span style="font-weight:600">{{m.name}}</span>
<span style="font-size:12px;color:var(--mute)">{{m.note}}</span>
<span style="font-size:12px;color:var(--acc);font-weight:500">{{m.spec}}</span>
</button>
</sc-for>
</div>
<div style="flex:0 0 auto;font-size:12px;color:var(--mute)">Model và tỉ lệ ở đây là ví dụ. Bản thật lấy theo khai báo của từng model.</div>
</div>
</sc-if>
<sc-if value="{{mo}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="Giọng đọc" style="position:absolute;left:8px;right:8px;bottom:72px;z-index:5;max-height:340px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(24,24,22,0.14);padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">
<sc-if value="{{trong}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Quay lại chọn loại giọng" onClick="{{quay}}" style="width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
</sc-if>
<div style="display:flex;flex-direction:column;line-height:1.3">
<span style="font-weight:600">{{title}}</span>
<span style="font-size:12px;color:var(--mute)">{{sub}}</span>
</div>
</div>
<div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
<sc-if value="{{ds1}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{tatDoc}}" aria-pressed="{{tat}}" style="{{tatStyle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z M22 9l-6 6 M16 9l6 6"></path></svg>
<span style="flex:1;text-align:left">Không đọc</span>
</button>
</sc-if>
<sc-for list="{{rows}}" as="v" hint-placeholder-count="5">
<sc-if value="{{v.isEng}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{v.pick}}" style="{{v.style}}">
<span style="flex:1;text-align:left">{{v.name}}</span>
<span style="font-size:12px;color:var(--mute)">{{v.note}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-if>
<sc-if value="{{v.isVoice}}" hint-placeholder-val="{{false}}">
<div style="display:flex;align-items:center;gap:8px">
<button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}">
<span style="flex:1;text-align:left">{{v.name}}</span>
</button>
<button type="button" aria-label="Nghe thử giọng {{v.name}}" style="width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
</button>
</div>
</sc-if>
</sc-for>
</div>
<div style="flex:0 0 auto;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>Tên giọng ở đây là ví dụ.</span><a href="#" style="color:var(--acc);font-weight:500">Quản lý giọng đã tải</a></div>
</div>
</sc-if>
<sc-if value="{{coModel}}" hint-placeholder-val="{{false}}">
<div style="display:flex;gap:8px;overflow-x:auto;padding:4px 12px 0">
<button type="button" aria-label="Chọn model" aria-expanded="{{moM}}" onClick="{{toggleModel}}" style="{{modelBtnStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
{{modelLabel}}
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{coRatio}}" hint-placeholder-val="{{false}}">
<label style="height:44px;box-sizing:border-box;padding:0 6px 0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;flex:0 0 auto"><select aria-label="Tỉ lệ khung hình" value="{{ratio}}" onChange="{{onRatio}}" style="border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;height:100%;cursor:pointer">
<sc-for list="{{ratioOpts}}" as="r" hint-placeholder-count="3"><option value="{{r.v}}">{{r.label}}</option></sc-for>
</select>
</label>
<sc-if value="{{coDur}}" hint-placeholder-val="{{false}}">
<label style="height:44px;box-sizing:border-box;padding:0 6px 0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;flex:0 0 auto"><select aria-label="Thời lượng" value="{{dur}}" onChange="{{onDur}}" style="border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;height:100%;cursor:pointer">
<sc-for list="{{durOpts}}" as="d" hint-placeholder-count="2"><option value="{{d.v}}">{{d.label}}</option></sc-for>
</select>
</label>
</sc-if>
</sc-if>
</div>
</sc-if>
<div style="display:flex;align-items:center;gap:8px;padding:8px 12px 12px">
<button type="button" aria-label="Đính kèm tệp" style="width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
</button>
<sc-if value="{{hienPill}}" hint-placeholder-val="{{true}}"><div style="flex:1;min-width:0;height:36px;display:flex;align-items:center;padding:0 12px;border-radius:18px;background:var(--bg);color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{model}}</div></sc-if>
<sc-if value="{{coModel}}" hint-placeholder-val="{{false}}"><div style="flex:1"></div></sc-if>
<button type="button" aria-label="{{loaLabel}}" aria-pressed="{{loa}}" onClick="{{toggleLoa}}" style="{{loaStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{loaD}}"></path></svg>
</button>
<button type="button" aria-label="{{micLabel}}" aria-pressed="{{nghe}}" onClick="{{toggleMic}}" style="{{micStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{micD}}"></path></svg>
</button>
<button type="button" aria-label="Gửi" style="width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5 M6 11l6-6 6 6"></path></svg>
</button>
</div>
</div>

<div role="tablist" aria-label="Chọn việc cần làm" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
{{m.label}}
</button>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="3">
<button type="button" style="min-height:44px;padding:8px 16px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--mute);text-align:left">{{i}}</button>
</sc-for>
</div>
</main>

<nav aria-label="Điều hướng chính" style="display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#FBFAF8;padding:6px 4px 10px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span style="font-size:11px">{{t.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { mode: 'chat', ratio: '1:1', dur: '', voice: 'tat', eng: '', mo: false, moM: false, imgModel: 'auto', vidModel: 'auto', chatModel: 'text', nghe: false };

  renderVals() {
    const s = this.state;
    const IC = {
      chat: 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',
      image: 'M4 5h16v14H4z M4 16l5-5 4 4 3-3 4 4 M9 9.5h.01',
      video: 'M3 6h12v12H3z M15 10l6-3v10l-6-3',
      dich: 'M4 5h9 M8.5 3v2 M6 5c.5 3 2.5 6 6 8 M11 5c-.5 3-3 6.5-7 8 M13 20l4-9 4 9 M14.5 17h5',
      search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4',
      home: 'M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-6h4v6',
      plug: 'M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4',
      sliders: 'M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4',
      folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'
    };
    const MODES = [
      { id: 'chat', label: 'Trò chuyện', d: IC.chat, ph: 'Hỏi bất kỳ điều gì, hoặc giao một việc…', model: 'AI text', ideas: ['Tóm tắt tài liệu tôi đính kèm', 'Soạn thư trả lời khách', 'Giá xăng hôm nay'] },
      { id: 'image', label: 'Vẽ ảnh', d: IC.image, ph: 'Tả bức ảnh bạn muốn…', model: 'Ảnh · tự chọn nguồn', ideas: ['Ảnh sản phẩm trên nền trắng', 'Tranh minh hoạ màu nước'] },
      { id: 'video', label: 'Tạo video', d: IC.video, ph: 'Tả cảnh quay…', model: 'Video · tự chọn nguồn', ideas: ['Hoàng hôn trên biển, máy quay lướt chậm'] },
      { id: 'dich', label: 'Dịch', d: IC.dich, ph: 'Dán văn bản cần dịch…', model: 'AI nhẹ', ideas: ['Dịch Anh sang Việt, giữ giọng văn'] }
    ];
    const vOn = 'flex:1;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:2px solid #0F766E;background:#E2F0ED;color:#181816;font-weight:500';
    const vOff = 'flex:1;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:1px solid #E4E2DC;background:#fff;color:#181816';
    const DATA = [['zerotts', 'ZeroTTS', ['Nữ miền Bắc', 'Nam miền Bắc', 'Nữ miền Nam']], ['vieneu', 'VieNeu', ['Nữ trẻ', 'Nam trầm']], ['kokoro', 'Kokoro', ['Nữ 1', 'Nam 1']]];
    const engOf = (v) => v.split(':')[0];
    const engStyle = 'width:100%;box-sizing:border-box;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:1px solid #E4E2DC;background:#F6F5F2;color:#181816;font-weight:500';
    const trong = s.eng !== '';
    const curEng = DATA.find((d) => d[0] === s.eng);
    const rows = [];
    if (!trong) {
      DATA.forEach(([id, name, vs]) => rows.push({ isEng: true, isVoice: false, name, note: engOf(s.voice) === id ? 'đang dùng' : vs.length + ' giọng', style: engStyle, on: false,
        pick: () => this.setState({ eng: id }) }));
    } else {
      curEng[2].forEach((vn, i) => rows.push({ isEng: false, isVoice: true, name: vn, note: '', on: s.voice === s.eng + ':' + i,
        style: s.voice === s.eng + ':' + i ? vOn : vOff, pick: () => this.setState({ voice: s.eng + ':' + i, mo: false, eng: '' }) }));
    }
    const IMG = [
      { id: 'auto', name: 'Tự chọn', note: 'Hệ thống chọn nguồn còn hạn mức', ratios: ['1:1', '3:4', '4:3', '9:16', '16:9'] },
      { id: 'gpt', name: 'ChatGPT ảnh', note: 'Qua tài khoản ChatGPT', ratios: ['1:1', '3:2', '2:3'] },
      { id: 'gem', name: 'Gemini ảnh', note: 'Qua tài khoản Gemini', ratios: ['1:1', '3:4', '4:3', '9:16', '16:9'] },
      { id: 'grok', name: 'Grok Imagine', note: 'Qua tài khoản Grok', ratios: ['1:1', '2:3', '3:2', '9:16', '16:9'] }
    ];
    const VID = [
      { id: 'auto', name: 'Tự chọn', note: 'Hệ thống chọn nguồn còn hạn mức', ratios: ['16:9', '9:16'], durs: ['6 giây', '8 giây', '10 giây'] },
      { id: 'veo', name: 'Veo (Flow)', note: 'Qua tài khoản Google Flow', ratios: ['16:9', '9:16'], durs: ['8 giây'] },
      { id: 'grokv', name: 'Grok Imagine', note: 'Qua tài khoản Grok', ratios: ['16:9', '9:16', '1:1'], durs: ['6 giây', '10 giây'] }
    ];
    const CHAT = [
      { id: 'text', name: 'AI text', note: 'Cân bằng, dùng cho hầu hết việc', spec: 'Combo, tự lùi khi hết hạn mức' },
      { id: 'kho', name: 'AI khó', note: 'Việc phức tạp, trả lời chậm hơn', spec: 'Combo, tự lùi khi hết hạn mức' },
      { id: 'nhe', name: 'AI nhẹ', note: 'Việc đơn giản, trả lời nhanh', spec: 'Combo, tự lùi khi hết hạn mức' },
      { id: 'gpt', name: 'ChatGPT', note: 'Qua tài khoản ChatGPT', spec: 'Model cụ thể' },
      { id: 'claude', name: 'Claude', note: 'Qua tài khoản Claude', spec: 'Model cụ thể' },
      { id: 'gemini', name: 'Gemini', note: 'Qua tài khoản Gemini', spec: 'Model cụ thể' },
      { id: 'ag', name: 'Antigravity', note: 'Qua tài khoản Antigravity', spec: 'Model cụ thể' }
    ];
    const isVid = s.mode === 'video';
    const LIST = isVid ? VID : (s.mode === 'chat' ? CHAT : IMG);
    const selId = isVid ? s.vidModel : (s.mode === 'chat' ? s.chatModel : s.imgModel);
    const mdl = LIST.find((m) => m.id === selId) || LIST[0];
    const coRatio = s.mode === 'image' || isVid;
    const coModel = coRatio || s.mode === 'chat';
    const rs = mdl.ratios || [];
    const ratio = rs.includes(s.ratio) ? s.ratio : (rs[0] || '');
    const durs = mdl.durs || [];
    const dur = durs.includes(s.dur) ? s.dur : durs[0];
    const mOn = 'box-sizing:border-box;width:100%;min-height:44px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;border:2px solid #0F766E;background:#E2F0ED;color:#181816;text-align:left';
    const mOff = 'box-sizing:border-box;width:100%;min-height:44px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;border:1px solid #E4E2DC;background:#fff;color:#181816;text-align:left';
    const models = LIST.map((m) => ({ name: m.name, note: m.note, on: m.id === mdl.id, style: m.id === mdl.id ? mOn : mOff,
      spec: m.ratios ? m.ratios.join(' · ') + (m.durs ? ' · ' + m.durs.join(' · ') : '') : m.spec,
      pick: () => this.setState(isVid ? { vidModel: m.id, moM: false } : (s.mode === 'chat' ? { chatModel: m.id, moM: false } : { imgModel: m.id, moM: false })) }));
    const pillOn = 'height:44px;padding:0 16px;border-radius:22px;border:1px solid #181816;background:#181816;color:#fff;font-size:13px;font-weight:500;flex:0 0 auto;white-space:nowrap';
    const pillOff = 'height:44px;padding:0 16px;border-radius:22px;border:1px solid #E4E2DC;background:#fff;color:#66645F;font-size:13px;flex:0 0 auto;white-space:nowrap';
    const opt = (label, on, fn) => ({ label, on, style: on ? pillOn : pillOff, pick: fn });
    let opts = [];
    // vẽ ảnh và video dùng danh sách chọn, không dùng nút
    const NHAN = { '1:1': 'vuông', '3:4': 'dọc', '4:3': 'ngang', '2:3': 'dọc', '3:2': 'ngang', '9:16': 'dọc điện thoại', '16:9': 'màn rộng' };
    const ic = 'width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;';
    const cur = MODES.find((m) => m.id === s.mode);
    const tab = (on) => 'flex:0 0 auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;font-size:14px;' +
      (on ? 'border:1px solid #181816;background:#fff;color:#181816;font-weight:500' : 'border:1px solid #E4E2DC;background:transparent;color:#66645F');
    const tb = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border-radius:12px;';
    const T = [['Studio', IC.chat, 'Main.dc.html', true], ['Tác phẩm', IC.folder, 'Tac-pham.dc.html', false], ['Nhà', IC.home, 'Nha.dc.html', false], ['Tiện ích', IC.plug, 'Tien-ich.dc.html', false], ['Hệ thống', IC.sliders, '#', false]];
    return {
      placeholder: cur.ph, model: cur.model, ideas: cur.ideas,
      loa: s.voice !== 'tat', mo: s.mo, nghe: s.nghe, tat: s.voice === 'tat',
      tatStyle: 'width:100%;box-sizing:border-box;' + (s.voice === 'tat' ? vOn : vOff),
      tatDoc: () => this.setState({ voice: 'tat', mo: false, eng: '' }),
      loaD: s.voice !== 'tat' ? 'M4 9v6h4l5 4V5L8 9z M16.5 8.5a5 5 0 0 1 0 7 M19 6a8.5 8.5 0 0 1 0 12' : 'M4 9v6h4l5 4V5L8 9z M22 9l-6 6 M16 9l6 6',
      micD: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3',
      loaLabel: s.voice !== 'tat' ? 'Đổi giọng đọc hoặc tắt đọc' : 'Chọn giọng đọc câu trả lời',
      micLabel: s.nghe ? 'Dừng nghe' : 'Nói để nhập chữ',
      loaStyle: ic + (s.voice !== 'tat' ? 'border:1px solid #0F766E;background:#E2F0ED;color:#0B5A53' : 'border:1px solid #E4E2DC;background:#fff;color:#66645F'),
      micStyle: ic + (s.nghe ? 'border:1px solid #B42318;background:#B42318;color:#fff' : 'border:1px solid #E4E2DC;background:#fff;color:#181816'),
      toggleLoa: () => this.setState({ mo: !s.mo, eng: '', moM: false }),
      toggleMic: () => this.setState(s.nghe ? { nghe: false, draft: (s.draft ? s.draft + ' ' : '') + '[lời nói được chuyển thành chữ ở đây]' } : { nghe: true }),
      ratio, dur: dur || '', coDur: durs.length > 0,
      ratioOpts: rs.map((r) => ({ v: r, label: r })),
      durOpts: durs.map((d) => ({ v: d, label: d })),
      onRatio: (e) => this.setState({ ratio: e.target.value }),
      onDur: (e) => this.setState({ dur: e.target.value }),
      opts, coModel, hienPill: !coModel, moM: s.moM, models, modelLabel: mdl.name,
      modelTitle: isVid ? 'Model tạo video' : (s.mode === 'chat' ? 'Model trả lời' : 'Model vẽ ảnh'),
      modelSub: s.mode === 'chat' ? 'Combo tự chọn model theo độ khó của việc' : 'Tỉ lệ khung hình đổi theo model đã chọn',
      coRatio,
      modelBtnStyle: 'height:44px;padding:0 12px;border-radius:18px;border:1px solid #0F766E;background:#E2F0ED;color:#0B5A53;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap',
      toggleModel: () => this.setState({ moM: !s.moM, mo: false }),
      rows, trong, ds1: !trong,
      title: trong ? curEng[1] : 'Giọng đọc câu trả lời',
      sub: trong ? 'Chọn một giọng đã tải' : 'Bấm vào một loại để xem các giọng đã tải',
      quay: () => this.setState({ eng: '' }),
      modes: MODES.map((m) => ({ label: m.label, d: m.d, on: s.mode === m.id, style: tab(s.mode === m.id), pick: () => this.setState({ mode: m.id, moM: false }) })),
      tabs: T.map(([label, d, href, on]) => ({ label, d, href, style: tb + (on ? 'color:#181816;font-weight:600' : 'color:#66645F') }))
    };
  }
}
</script>
</body>
</html>
