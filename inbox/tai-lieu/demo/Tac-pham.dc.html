<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tác phẩm web2api</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
select{font:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #0F766E;outline-offset:2px}
.cuon{scrollbar-width:thin;scrollbar-color:#B9B6AE transparent}
.cuon::-webkit-scrollbar{width:8px}
.cuon::-webkit-scrollbar-thumb{background:#B9B6AE;border-radius:4px}
.o .nutto{opacity:0;transition:opacity .15s}
.o:hover .nutto,.o:focus-within .nutto{opacity:1}
@keyframes chay{from{width:0}to{width:100%}}
.mc{min-height:36px;padding:0 14px}
.gal{--h:176px}
.bn{display:none}
.wmp{display:none}
.ctxt{display:none}
@media (max-width:1023px){
.tb{min-height:52px !important;height:auto !important;padding:6px 14px !important;gap:10px !important}
.tm{display:none !important}
.wmd{display:none}.wmp{display:block}
.ctxt{display:flex !important}
.ctxb{display:none !important}
.tao{display:none !important}
.bn{display:flex !important;position:relative;z-index:20;flex:0 0 auto;align-items:stretch;border-top:1px solid #E4E2DC;background:#FBFAF8;padding:0 4px env(safe-area-inset-bottom,0px)}
.bn > a,.bn > button{min-height:52px;justify-content:center}
main.pg{padding:12px 16px 0 !important}
}
@media (max-width:1023px){.gal{--h:112px}.rail{flex:0 0 40px !important}.rail button{font-size:10px !important;padding:0 !important}}
@media (max-width:1023px){.ctxt{flex-wrap:wrap !important;overflow:visible !important;row-gap:6px !important}.ctxt .mc{min-height:36px !important;padding:0 8px 0 12px !important;font-size:13px !important;gap:6px !important}.ctxt .ddw{position:relative !important}.ctxt .ddp{position:absolute !important;left:50% !important;transform:translateX(-50%) !important;top:calc(100% + 6px) !important;width:max-content !important;min-width:150px !important;max-width:min(240px,calc(100vw - 24px)) !important}}
@media (pointer:coarse){.mc{min-height:44px !important}input,select,textarea{font-size:16px !important}[role=menuitem]{min-height:44px !important}}
</style>
</helmet>
<div onKeyDown="{{onKey}}" style="--ink:#181816;--mute:#66645F;--line:#E4E2DC;--bg:#F6F5F2;--card:#FFFFFF;--acc:#0F766E;--accsoft:#E2F0ED;height:100vh;height:100dvh;min-height:560px;overflow-x:hidden;display:flex;flex-direction:column;flex-wrap:nowrap;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:14px;line-height:1.5">

<nav aria-label="Điều hướng chính" class="tb" style="{{navStyle}}">
<div style="display:flex;align-items:center;gap:10px;flex:0 0 auto">
<div style="width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{logo}}"></path></svg></div>
<div class="wmd" style="font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:500;letter-spacing:-0.01em">web2api</div>
<sc-if value="{{sinCtx}}" hint-placeholder-val="{{true}}"><div class="wmp" style="font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:500;letter-spacing:-0.01em">web2api</div></sc-if>
</div>
<sc-if value="{{coCtx}}" hint-placeholder-val="{{true}}"><div class="ctxt" role="toolbar" aria-label="Mục lục" style="align-items:center;gap:6px;flex:1 1 auto;min-width:0;overflow-x:auto">
<sc-for list="{{ctx}}" as="x" hint-placeholder-count="3">
<sc-if value="{{x.isDd}}" hint-placeholder-val="{{true}}"><div class="ddw" style="position:relative;flex:0 0 auto">
<button type="button" class="mc" aria-haspopup="menu" aria-expanded="{{x.open}}" aria-label="{{x.nhan}}" onClick="{{x.toggle}}" style="{{x.btn}}"><span>{{x.cur}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{x.chev}}"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{x.open}}" hint-placeholder-val="{{false}}"><div role="menu" class="ddp" aria-label="{{x.nhan}}" style="position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:200px;max-width:min(320px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,24,22,0.14);padding:4px;display:flex;flex-direction:column;gap:1px;max-height:60vh;overflow-y:auto">
<sc-for list="{{x.items}}" as="u" hint-placeholder-count="4"><button type="button" role="menuitem" aria-current="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}"><span>{{u.label}}</span><sc-if value="{{u.coSo}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;display:flex"><span style="{{u.soStyle}}">{{u.so}}</span></span></sc-if></button></sc-for>
</div></sc-if>
</div></sc-if>
<sc-if value="{{x.isPlus}}" hint-placeholder-val="{{false}}"><button type="button" class="mc" aria-label="{{x.nhan}}" title="{{x.nhan}}" aria-pressed="{{x.on}}" onClick="{{x.pick}}" style="{{x.btn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button></sc-if>
</sc-for>
</div></sc-if>
<div class="tm" style="display:flex;align-items:center;gap:2px;flex:1 1 auto;min-width:0">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<div style="position:relative;flex:0 0 auto;{{n.wst}}">
<sc-if value="{{n.link}}" hint-placeholder-val="{{true}}"><a href="{{n.href}}" aria-label="{{n.label}}" onClick="{{n.dong}}" style="{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg><span>{{n.label}}</span></a></sc-if>
<sc-if value="{{n.hasSub}}" hint-placeholder-val="{{false}}"><button type="button" aria-haspopup="menu" aria-expanded="{{n.open}}" onClick="{{n.toggle}}" style="{{n.btnStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg><span>{{n.label}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{n.chev}}"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{n.open}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="Mục trong {{n.label}}" style="position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:30;width:200px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,24,22,0.14);padding:4px;display:flex;flex-direction:column;gap:1px">
<sc-for list="{{n.subs}}" as="u" hint-placeholder-count="5">
<sc-if value="{{u.ext}}" hint-placeholder-val="{{false}}"><a role="menuitem" href="{{u.href}}" onClick="{{u.pick}}" style="{{u.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{u.d}}"></path></svg><span>{{u.label}}</span><sc-if value="{{u.coBao}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;min-width:20px;height:20px;box-sizing:border-box;padding:0 6px;border-radius:10px;background:#B42318;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">{{u.bao}}</span></sc-if></a></sc-if>
<sc-if value="{{u.inner}}" hint-placeholder-val="{{false}}"><button type="button" role="menuitem" aria-current="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{u.d}}"></path></svg><span>{{u.label}}</span><sc-if value="{{u.coBao}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;min-width:20px;height:20px;box-sizing:border-box;padding:0 6px;border-radius:10px;background:#B42318;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">{{u.bao}}</span></sc-if></button></sc-if>
</sc-for>
</div>
</sc-if></sc-if>
</div>
</sc-for>
</div>
<div class="acc" style="position:relative;flex:0 0 auto;margin-left:auto">
<button type="button" aria-haspopup="menu" aria-expanded="{{accMo}}" aria-label="Tài khoản" onClick="{{accToggle}}" style="width:36px;height:36px;padding:0;border-radius:50%;border:0;background:var(--accsoft);color:#0B5A53;display:flex;align-items:center;justify-content:center;font:inherit;font-weight:600;cursor:pointer">C</button>
<sc-if value="{{accMo}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="Tài khoản" style="position:absolute;top:calc(100% + 8px);right:0;z-index:30;width:248px;max-width:calc(100vw - 24px);box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,24,22,0.14);padding:6px;display:flex;flex-direction:column;gap:2px">
<div style="display:flex;align-items:center;gap:12px;padding:10px 10px 12px">
<div style="flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--accsoft);color:#0B5A53;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px">C</div>
<div style="display:flex;flex-direction:column;line-height:1.35;min-width:0"><span style="font-weight:600">Chủ nhà</span><span style="font-size:12px;color:var(--mute)">Quản trị viên</span></div>
</div>
<div style="height:1px;background:var(--line);margin:0 4px 4px"></div>
<button type="button" role="menuitem" onClick="{{dangXuat}}" style="display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#B42318;font:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5 M15 8l4 4-4 4 M19 12H9"></path></svg>Đăng xuất</button>
</div>
</sc-if>
</div>
</nav>

<main class="pg" style="flex:1 1 0;min-width:0;min-height:0;overflow-x:hidden;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;padding:20px 32px 0">
<sc-if value="{{coCtxW}}" hint-placeholder-val="{{true}}"><div class="ctxb" role="toolbar" aria-label="Mục lục" style="position:sticky;top:0;z-index:4;background:var(--bg);box-shadow:0 1px 0 var(--line);padding:6px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px">
<sc-for list="{{ctx}}" as="x" hint-placeholder-count="3">
<sc-if value="{{x.webDd}}" hint-placeholder-val="{{true}}"><div role="tablist" aria-label="{{x.nhan}}" style="{{x.sepW}}"><sc-for list="{{x.items}}" as="u" hint-placeholder-count="4"><button type="button" role="tab" class="mc" aria-selected="{{u.on}}" onClick="{{u.pick}}" style="{{u.cstyle}}"><span>{{u.label}}</span><sc-if value="{{u.coSo}}" hint-placeholder-val="{{false}}"><span style="{{u.soStyle}}">{{u.so}}</span></sc-if></button></sc-for></div></sc-if>
<sc-if value="{{x.isPlus}}" hint-placeholder-val="{{false}}"><button type="button" class="mc" aria-label="{{x.nhan}}" title="{{x.nhan}}" aria-pressed="{{x.on}}" onClick="{{x.pick}}" style="{{x.btn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button></sc-if>
</sc-for>
</div></sc-if>
<sc-if value="{{ddMo}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" onClick="{{ddDong}}" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:2"></div></sc-if>

<div style="flex:1 1 0;min-height:0;display:flex;gap:6px;padding-bottom:12px">
<div class="cuon" style="flex:1 1 0;min-width:0;min-height:0;overflow-y:auto;padding-right:6px">
<sc-if value="{{coVe}}" hint-placeholder-val="{{false}}"><button type="button" class="mc" onClick="{{veDau}}" style="margin:6px 0 2px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>Về mới nhất</button></sc-if>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section aria-label="{{g.label}}">
<div style="position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0 6px;display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:15px;font-weight:600">{{g.label}}</h2><span style="font-size:12px;color:var(--mute)">{{g.sub}}</span></div>
<div class="gal" style="display:flex;flex-wrap:wrap;gap:4px">
<sc-for list="{{g.cells}}" as="c" hint-placeholder-count="5">
<div class="o" style="{{c.wrap}}">
<button type="button" aria-label="{{c.label}}" onClick="{{c.tile}}" style="{{c.style}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></button>
<span style="{{c.badgeStyle}}">{{c.badge}}</span>
<sc-if value="{{c.canPlay}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="Phát video" onClick="{{c.play}}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(24,24,22,0.74);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></button></sc-if>
<div class="nutto" style="position:absolute;top:6px;right:6px;display:flex;gap:6px">
<button type="button" aria-label="Phóng to" onClick="{{c.open}}" style="width:40px;height:40px;border-radius:50%;border:0;background:rgba(24,24,22,0.74);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iExpand}}"></path></svg></button>
<button type="button" aria-label="Tải xuống" disabled="{{c.busy}}" style="width:40px;height:40px;border-radius:50%;border:0;background:rgba(24,24,22,0.74);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11 M7 11l5 5 5-5 M5 20h14"></path></svg></button>
<button type="button" aria-label="Xoá" style="width:40px;height:40px;border-radius:50%;border:0;background:rgba(24,24,22,0.74);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13"></path></svg></button>
</div>
<div class="nutto" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:26px 10px 8px;border-radius:0 0 6px 6px;background:linear-gradient(to top,rgba(15,15,14,0.86),rgba(15,15,14,0));color:#fff;display:flex;align-items:flex-end;gap:8px;pointer-events:none">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35"><span style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{c.line1}}</span><span style="font-size:11px;color:#E8E6DF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{c.line2}}</span></div>
<button type="button" style="pointer-events:auto;flex:0 0 auto;min-height:30px;padding:0 10px;border-radius:15px;border:1px solid rgba(255,255,255,0.5);background:transparent;color:#fff;font-size:12px">Dùng lại</button>
</div>
</div>
</sc-for>
<div aria-hidden="true" style="flex:999999 1 0;height:0;min-width:0"></div>
</div>
</section>
</sc-for>
<sc-if value="{{trongTP}}" hint-placeholder-val="{{false}}"><div style="padding:48px 0;text-align:center;color:var(--mute)">Chưa có tác phẩm nào khớp bộ lọc.</div></sc-if>
</div>
<sc-if value="{{coRail}}" hint-placeholder-val="{{true}}"><nav class="rail" aria-label="Dòng thời gian" style="flex:0 0 44px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:10px 0 6px;min-height:0">
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<sc-if value="{{r.isYear}}" hint-placeholder-val="{{false}}"><span style="text-align:center;font-size:11px;font-weight:700;color:var(--ink);line-height:1.2">{{r.label}}</span></sc-if>
<sc-if value="{{r.isMonth}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{r.aria}}" aria-current="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button></sc-if>
</sc-for>
</nav></sc-if>
</div>
</main>
<nav aria-label="Điều hướng chính (điện thoại)" class="bn">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<sc-if value="{{n.bLink}}" hint-placeholder-val="{{true}}"><a href="{{n.href}}" aria-label="{{n.label}}" onClick="{{n.dong}}" style="{{n.bstyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg><span>{{n.label}}</span></a></sc-if>
<sc-if value="{{n.bSub}}" hint-placeholder-val="{{false}}"><button type="button" aria-haspopup="menu" aria-expanded="{{n.open}}" aria-label="{{n.label}}" onClick="{{n.toggle}}" style="{{n.bbtn}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg><span>{{n.label}}</span></button></sc-if>
</sc-for>
<sc-if value="{{coSheet}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position:absolute;{{sheet.arrow}};bottom:calc(100% + 4px);z-index:31;width:12px;height:12px;box-sizing:border-box;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)"></div>
<div role="menu" aria-label="Mục trong {{sheet.label}}" style="position:absolute;{{sheet.pos}};width:200px;bottom:calc(100% + 10px);z-index:30;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 -6px 24px rgba(24,24,22,0.16);padding:4px;display:flex;flex-direction:column;gap:1px;max-height:60vh;overflow-y:auto">
<sc-for list="{{sheet.subs}}" as="u" hint-placeholder-count="5">
<sc-if value="{{u.ext}}" hint-placeholder-val="{{false}}"><a role="menuitem" href="{{u.href}}" onClick="{{u.pick}}" style="{{u.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{u.d}}"></path></svg><span>{{u.label}}</span><sc-if value="{{u.coBao}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;min-width:20px;height:20px;box-sizing:border-box;padding:0 6px;border-radius:10px;background:#B42318;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">{{u.bao}}</span></sc-if></a></sc-if>
<sc-if value="{{u.inner}}" hint-placeholder-val="{{false}}"><button type="button" role="menuitem" aria-current="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{u.d}}"></path></svg><span>{{u.label}}</span><sc-if value="{{u.coBao}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;min-width:20px;height:20px;box-sizing:border-box;padding:0 6px;border-radius:10px;background:#B42318;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">{{u.bao}}</span></sc-if></button></sc-if>
</sc-for>
</div>
</sc-if>
</nav>
<sc-if value="{{backdrop}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" onClick="{{menuDong}}" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:19"></div></sc-if>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="Xem toàn màn hình" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(15,15,14,0.96);color:#fff;display:flex;flex-direction:column">
<div style="flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3">
<span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{v.title}}</span>
