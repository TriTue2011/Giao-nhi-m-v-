<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#efe3cf}canvas{display:block}</style>
<canvas id="c" width="920" height="692"></canvas>
<script>
const W=800,H=632,K=800/1200,CW=920,CH=692,PX=60,PY=30;
const gl=document.getElementById('c').getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:true,preserveDrawingBuffer:true});
// toạ độ trong hệ 1200 px rộng của ảnh gốc; K đưa về 800 px
const CFG={
 xa:{tex:'xa.png',r:150,legs:[
  {hip:[210,575],knee:[86,735],paw:[72,890],c:-0.25,a:0.17,ph:.5},
  {hip:[952,687],knee:[1021,790],paw:[1103,908],c:0.45,a:0.14,ph:.5}]},
 chinh:{tex:'chinh.png',legs:[
  {hip:[331,632],knee:[276,777],paw:[366,908],c:0.0,a:0.17,ph:0,r:105},
  {hip:[793,687],knee:[759,811],paw:[814,908],c:0.0,a:0.15,ph:0,r:78}]}
};
for(const L of Object.values(CFG))for(const g of L.legs)for(const k of['hip','knee','paw'])g[k]=[g[k][0]*K,g[k][1]*K];
for(const L of Object.values(CFG))for(const g of L.legs){g.rest=Math.atan2(g.paw[0]-g.hip[0],g.paw[1]-g.hip[1]);g.r=(g.r||CFG.xa.r)*K}
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
function dseg(p,a,b){const ax=b[0]-a[0],ay=b[1]-a[1];let t=((p[0]-a[0])*ax+(p[1]-a[1])*ay)/(ax*ax+ay*ay);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*ax,p[1]-a[1]-t*ay)}
const VS=`attribute vec2 p;attribute vec2 uv;attribute vec4 w;uniform mat3 M[5];uniform vec2 sz;uniform vec2 off;varying vec2 v;
void main(){vec3 q=vec3(p,1.0);float wb=1.0-w.x-w.y-w.z-w.w;vec3 r=wb*(M[0]*q)+w.x*(M[1]*q)+w.y*(M[2]*q)+w.z*(M[3]*q)+w.w*(M[4]*q);r.xy+=off;
gl_Position=vec4(r.x/sz.x*2.0-1.0,1.0-r.y/sz.y*2.0,0.0,1.0);v=uv;}`;
const FS=`precision mediump float;uniform sampler2D t;varying vec2 v;void main(){gl_FragColor=texture2D(t,v);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const CELL=8,NX=W/CELL,NY=Math.ceil(H/CELL);
function build(layer){
  const P=[],UV=[],Wt=[];
  for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){
    const x=i*CELL,y=Math.min(H,j*CELL);P.push(x,y);UV.push(x/W,y/H);const w=[0,0,0,0];
    layer.legs.forEach((L,k)=>{
      const d=Math.min(dseg([x,y],L.hip,L.knee),dseg([x,y],L.knee,L.paw));
      const lw=1-sm(L.r,L.r+36*K,d),low=sm(L.knee[1]-30*K,L.knee[1]+30*K,y),up=sm(L.hip[1]-10*K,L.hip[1]+110*K,y);
      w[k*2]=lw*up*(1-low);w[k*2+1]=lw*low;});
    Wt.push(...w);}
  const idx=[];for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i,b=a+1,c=a+NX+1,d=c+1;idx.push(a,b,c,b,d,c)}
  const mk=(d,t)=>{const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,d,gl.STATIC_DRAW);return b};
  layer.bp=mk(new Float32Array(P),gl.ARRAY_BUFFER);layer.bu=mk(new Float32Array(UV),gl.ARRAY_BUFFER);layer.bw=mk(new Float32Array(Wt),gl.ARRAY_BUFFER);layer.bi=mk(new Uint16Array(idx),gl.ELEMENT_ARRAY_BUFFER);layer.n=idx.length;}
const I=()=>[1,0,0,0,1,0,0,0,1];
const mul=(A,B)=>{const R=new Array(9).fill(0);for(let r=0;r<3;r++)for(let c=0;c<3;c++)for(let k=0;k<3;k++)R[c*3+r]+=A[k*3+r]*B[c*3+k];return R};
const T=(x,y)=>[1,0,0,0,1,0,x,y,1];const Rt=a=>{const c=Math.cos(a),s=Math.sin(a);return[c,s,0,-s,c,0,0,0,1]};const Sc=(sx,sy)=>[sx,0,0,0,sy,0,0,0,1];
const about=(piv,M)=>mul(T(piv[0],piv[1]),mul(M,T(-piv[0],-piv[1])));
const A=window.A={knee:0.62,duty:0.6};
function dang(phi){phi=((phi%1)+1)%1;
  if(phi<A.duty){const s=phi/A.duty;return{sh:1-2*s,flex:0,stance:1}}
  const s=(phi-A.duty)/(1-A.duty),e=s*s*(3-2*s);return{sh:-1+2*e,flex:A.knee*Math.sin(Math.PI*s),stance:0}}
function bones(layer,t){const M=[I()];
  layer.legs.forEach(L=>{const g=dang(t+L.ph);const abs=L.c+L.a*g.sh;const th=-(abs-L.rest);
    const sig=g.stance?1/Math.max(0.92,Math.cos(th)):1;
    const up=about(L.hip,mul(Rt(th),Sc(1,sig)));const low=mul(up,about(L.knee,Rt(g.flex)));M.push(up,low);});
  return M;}
function loadTex(src){return new Promise(r=>{const im=new Image();im.onload=()=>{const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);for(const [a,b] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,a,b);r(tx)};im.src=src})}
const loc={p:gl.getAttribLocation(pr,'p'),uv:gl.getAttribLocation(pr,'uv'),w:gl.getAttribLocation(pr,'w'),off:gl.getUniformLocation(pr,'off'),M:gl.getUniformLocation(pr,'M'),sz:gl.getUniformLocation(pr,'sz')};
function ve(t){gl.viewport(0,0,CW,CH);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  for(const key of['xa','chinh']){const L=CFG[key];const M=bones(L,t);while(M.length<5)M.push(I());
    gl.bindBuffer(gl.ARRAY_BUFFER,L.bp);gl.enableVertexAttribArray(loc.p);gl.vertexAttribPointer(loc.p,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,L.bu);gl.enableVertexAttribArray(loc.uv);gl.vertexAttribPointer(loc.uv,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,L.bw);gl.enableVertexAttribArray(loc.w);gl.vertexAttribPointer(loc.w,4,gl.FLOAT,false,0,0);
    gl.uniform2f(loc.off,PX,PY+3*Math.sin(2*Math.PI*(t*2+0.25)));
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,L.bi);gl.bindTexture(gl.TEXTURE_2D,L.tx);
    gl.uniformMatrix3fv(loc.M,false,new Float32Array(M.flat()));gl.uniform2f(loc.sz,CW,CH);gl.drawElements(gl.TRIANGLES,L.n,gl.UNSIGNED_SHORT,0);}}
window.ve=ve;
(async()=>{for(const k of['xa','chinh']){build(CFG[k]);CFG[k].tx=await loadTex(CFG[k].tex)}ve(0);window.san=1})();
</script>
